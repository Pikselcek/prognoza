<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPP Live Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; color: #1e3c72; font-size: 24px; }
        .station-box {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .station-header {
            background: #1e3c72;
            color: white;
            padding: 15px;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .live-dot {
            height: 10px; width: 10px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        iframe {
            width: 100%;
            height: 450px;
            border: none;
            display: block;
        }
        .info-text {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚌 Spremljanje avtobusov LPP</h1>
        
        <div class="station-box">
            <div class="station-header">
                <span><span class="live-dot"></span>Letališka</span>
                <span style="font-size: 14px; opacity: 0.8;">204041</span>
            </div>
            <iframe src="https://ljbus.cc/prihodi-avtobusov-lpp/letaliska-204041" loading="lazy" title="Letališka"></iframe>
        </div>

        <div class="station-box">
            <div class="station-header">
                <span><span class="live-dot"></span>Privoz</span>
                <span style="font-size: 14px; opacity: 0.8;">602112</span>
            </div>
            <iframe src="https://ljbus.cc/prihodi-avtobusov-lpp/privoz-602112" loading="lazy" title="Privoz"></iframe>
        </div>

        <div class="station-box">
            <div class="station-header">
                <span><span class="live-dot"></span>Livada</span>
                <span style="font-size: 14px; opacity: 0.8;">603092</span>
            </div>
            <iframe src="https://ljbus.cc/prihodi-avtobusov-lpp/livada-603092" loading="lazy" title="Livada"></iframe>
        </div>

        <div class="info-text">
            Podatki se na izvorni strani posodabljajo samodejno v realnem času.
        </div>
    </div>
</body>
</html>
